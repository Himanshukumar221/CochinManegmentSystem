<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Attendance</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

/* CARD */
.container{
    width:380px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    color:white;
    text-align:center;
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    margin-bottom:25px;
    font-size:24px;
    letter-spacing:1px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(to right,#ef4444,#dc2626);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

button:active{
    transform:scale(0.98);
}

/* SMALL TEXT */
small{
    display:block;
    margin-top:10px;
    color:#f1f5f9;
}

</style>
</head>

<body>

<div class="container">

    <h2>🗑 Delete Attendance</h2>

    <form action="DeleteAttendanceServlet" method="post">

        <input type="date" name="start_date" required>
        <input type="date" name="end_date" required>

        <button type="submit">Delete Attendance</button>

    </form>

    <small>Select date range carefully</small>

</div>

</body>
</html>
