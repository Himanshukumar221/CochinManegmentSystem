<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHS WORLD MUNGER</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020617;
    color:white;
}

/* 🔥 NAVBAR */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(12px);
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:45px;
    height:45px;
    border-radius:50%;
    box-shadow:0 0 10px cyan;
}

.logo span{
    font-size:22px;
    font-weight:bold;
}

/* MENU LINKS */
.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    position:relative;
    font-size:18px;
}

.nav-links a::after{
    content:'';
    position:absolute;
    width:0%;
    height:2px;
    background:#38bdf8;
    left:0;
    bottom:-5px;
    transition:0.3s;
}

.nav-links a:hover::after{
    width:100%;
}

/* 🔥 HAMBURGER */
.menu-toggle{
    display:none;
    font-size:30px;
    cursor:pointer;
}

/* 🔥 HERO */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;

    background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url('home.png') center/cover no-repeat;
}

.hero h1{
    font-size:60px;
    letter-spacing:3px;
    text-shadow:0 0 25px #38bdf8;
}

.hero p{
    margin-top:15px;
    font-size:22px;
    color:#cbd5f5;
}

/* 🔥 SECTION */
.section{
    padding:80px 20px;
    text-align:center;
}

.section h2{
    font-size:36px;
    margin-bottom:40px;
}

/* 🔥 BUTTONS */
.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
}

.buttons button{
    padding:20px 50px;
    min-width:240px;
    border:none;
    border-radius:60px;
    font-size:18px;
    font-weight:600;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    box-shadow:0 8px 0 #1e40af, 0 15px 30px rgba(0,0,0,0.6);
    transition:0.3s;
}

.buttons button:hover{
    transform:translateY(-6px);
}

.buttons button:active{
    transform:translateY(4px);
}

/* SPECIAL COLORS */
.buttons button:nth-child(1){
    background:linear-gradient(135deg,#22c55e,#16a34a);
}
.buttons button:nth-child(3){
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

/* CARDS */
.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.card{
    width:240px;
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    padding:15px;
    backdrop-filter:blur(10px);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.05);
}

.card img{
    width:100%;
    border-radius:10px;
}

.card p{
    margin-top:10px;
    font-size:18px;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:20px;
    background:#020617;
    margin-top:40px;
}

/* 📱 MOBILE RESPONSIVE */
@media(max-width:768px){

    .hero h1{
        font-size:32px;
    }

    .hero p{
        font-size:16px;
    }

    .menu-toggle{
        display:block;
        color:white;
    }

    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        right:20px;
        background:rgba(0,0,0,0.9);
        padding:15px;
        border-radius:10px;
    }

    .nav-links a{
        margin:10px 0;
    }

    .nav-links.active{
        display:flex;
    }

    .buttons{
        flex-direction:column;
        align-items:center;
    }

    .buttons button{
        width:90%;
        font-size:16px;
        padding:18px;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">
        <img src="logo.jpeg">
        <span>MATHS WORLD</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">=</div>

    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</div>

<!-- HERO -->
<div class="hero">
    <div>
        <h1>MATHS WORLD MUNGER</h1>
        <p>Best Coaching for Class 10th & 12th Students</p>
    </div>
</div>

<!-- SERVICES -->
<div class="section">

<h2>Student Services</h2>

<div class="buttons">

    <button onclick="location.href='admin_login.html'">Admin Login</button>

    <button onclick="location.href='adminloginforattendence.html'">Take Attendance</button>

    <button onclick="location.href='cpay.html'">Check Fee & Pay</button>

    <button onclick="location.href='studentresultcheck.html'">Check Our Result</button>

    <button onclick="location.href='ViewNotesServlet'">Download Important Notes</button>

</div>

</div>

<!-- TEACHER -->
<div class="section">
<h2>Founder / Teacher</h2>

<div class="cards">
<div class="card">
<img src="t.jpeg">
<p>Mr Akshay Sir</p>
</div>
</div>
</div>

<!-- LOCATION -->
<div class="section">
<h2>Our Location</h2>
<p>Munger, Bihar</p>

<iframe src="https://maps.google.com/maps?q=munger&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="80%" height="300"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
<p>© 2026 MATHS WORLD MUNGER</p>
</div>

<!-- JS -->
<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
