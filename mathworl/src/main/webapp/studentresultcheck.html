<!DOCTYPE html>
<html>
<head>
<title>Check Result</title>

<style>
body{
    font-family:'Segoe UI';
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    width:320px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:linear-gradient(to right,#667eea,#764ba2);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{opacity:0.9;}
</style>
</head>

<body>

<div class="card">
<h3>📄 Check Your Result</h3>

<form action="StudentResultServlet" method="post">
<input type="text" name="reg" placeholder="Enter Reg No" required>
<input type="date" name="dob" required>
<button type="submit">Check Result</button>
</form>

</div>

</body>
</html>
