<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delete Student</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#ff6a6a,#ff3d3d);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h2{text-align:center;color:#d11;}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#d11;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#a00;
}

.note{
    font-size:13px;
    color:#555;
    text-align:center;
}
</style>
</head>

<body>

<div class="card">

<h2>🗑 Delete Student</h2>

<form action="Delete" method="post">

<input type="text" name="std_reg_no" placeholder="Enter Registration No">
<input type="text" name="std_name" placeholder="OR Enter Student Name">

<p class="note">Enter ANY ONE field</p>

<button type="submit">Delete Student</button>

</form>

</div>

</body>
</html>
